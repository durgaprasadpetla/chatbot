<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Registration</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(120deg,#2563eb,#4f46e5);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Registration Card */

.container{
    background:white;
    padding:40px;
    width:350px;
    border-radius:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.container h2{
    text-align:center;
    margin-bottom:25px;
}

/* Input fields */

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:5px;
    border:1px solid #ccc;
}

/* Button */

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    border:none;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

/* Login link */

.login-link{
    text-align:center;
    margin-top:15px;
}

.login-link a{
    text-decoration:none;
    color:#2563eb;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h2>Create Account</h2>

<form action="/register" method="post">

<label>Name</label>
<input type="text" name="name" placeholder="Enter your name" required>

<label>Email</label>
<input type="email" name="email" placeholder="Enter your email" required>

<label>Password</label>
<input type="password" name="password" placeholder="Enter password" required>

<button type="submit">Register</button>

</form>

<div class="login-link">
Already have an account? <a href="/login">Login</a>
</div>

</div>

</body>
</html>
