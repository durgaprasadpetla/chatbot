<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<title>Chat History - AI Assistant</title>

<style>

/* ------------------------------------------------ */
/* GLOBAL BACKGROUND                                */
/* ------------------------------------------------ */

body{
margin:0;
font-family:"Inter",Arial,sans-serif;
background:url("https://images.unsplash.com/photo-1526378722370-7ad74c48e24f?auto=format&w=1500&q=80") no-repeat center center/cover;
height:100vh;
overflow:hidden;
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
backdrop-filter:blur(6px);
}

/* ------------------------------------------------ */
/* MAIN CARD                                        */
/* ------------------------------------------------ */

.container{
position:relative;
width:92%;
max-width:900px;
height:85vh;
margin:40px auto;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(18px);
border-radius:18px;
box-shadow:0 10px 35px rgba(0,0,0,0.35);
display:flex;
flex-direction:column;
color:white;
}

/* ------------------------------------------------ */
/* HEADER                                           */
/* ------------------------------------------------ */

.header{
padding:18px 25px;
border-bottom:1px solid rgba(255,255,255,0.25);
display:flex;
justify-content:space-between;
align-items:center;
}

.header h2{
margin:0;
font-size:24px;
font-weight:700;
}

/* ------------------------------------------------ */
/* BUTTONS                                          */
/* ------------------------------------------------ */

.top-actions{
display:flex;
gap:10px;
}

.btn{
padding:10px 16px;
border-radius:10px;
background:linear-gradient(135deg,#43cea2,#185a9d);
color:white;
text-decoration:none;
font-weight:600;
font-size:14px;
border:none;
cursor:pointer;
transition:0.25s;
}

.btn:hover{
transform:translateY(-2px);
box-shadow:0 6px 15px rgba(80,150,255,0.35);
}

.clear-btn{
background:linear-gradient(135deg,#ff4e50,#c31432);
}

/* ------------------------------------------------ */
/* HISTORY LIST                                     */
/* ------------------------------------------------ */

#historyBox{
flex:1;
overflow-y:auto;
padding:25px;
display:flex;
flex-direction:column;
gap:16px;
}

/* ------------------------------------------------ */
/* MESSAGE ROW                                      */
/* ------------------------------------------------ */

.msg-row{
display:flex;
align-items:flex-start;
gap:12px;
animation:fadeIn 0.25s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
border:2px solid rgba(255,255,255,0.4);
}

/* ------------------------------------------------ */
/* MESSAGE BUBBLE                                   */
/* ------------------------------------------------ */

.msg{
background:rgba(255,255,255,0.9);
color:#222;
padding:14px 16px;
border-radius:14px;
max-width:70%;
line-height:1.6;
font-size:15px;
}

.user{
background:rgba(150,200,255,0.9);
margin-left:auto;
border-bottom-right-radius:4px;
}

.bot{
background:rgba(180,255,205,0.9);
border-bottom-left-radius:4px;
}

.timestamp{
font-size:11px;
margin-top:6px;
color:#444;
}

/* ------------------------------------------------ */
/* EMPTY STATE                                      */
/* ------------------------------------------------ */

.empty{
text-align:center;
opacity:0.8;
font-size:15px;
margin-top:40px;
}

/* ------------------------------------------------ */
/* SCROLLBAR                                        */
/* ------------------------------------------------ */

#historyBox::-webkit-scrollbar{
width:6px;
}

#historyBox::-webkit-scrollbar-thumb{
background:rgba(255,255,255,0.4);
border-radius:10px;
}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="container">

<div class="header">

<h2>📜 Chat History</h2>

<div class="top-actions">
<a class="btn" href="/chat">⬅ Back</a>
<button class="btn clear-btn" onclick="clearHistory()">🗑 Clear</button>
</div>

</div>

<div id="historyBox"></div>

</div>

<script>

async function loadHistory(){

let historyBox=document.getElementById("historyBox");

historyBox.innerHTML="Loading history...";

try{

let response=await fetch("/api/chat/history");

let messages=await response.json();

historyBox.innerHTML="";

if(messages.length===0){
historyBox.innerHTML='<div class="empty">No chat history yet.</div>';
return;
}

messages.forEach(msg=>{

let row=document.createElement("div");
row.className="msg-row";

let avatar=document.createElement("img");
avatar.className="avatar";

let bubble=document.createElement("div");
bubble.className="msg "+msg.role;

bubble.innerText=msg.message;

let time=document.createElement("div");
time.className="timestamp";
time.textContent=new Date(msg.timestamp).toLocaleString();

bubble.appendChild(time);

if(msg.role==="user"){
avatar.src="https://cdn-icons-png.flaticon.com/512/149/149071.png";
row.style.flexDirection="row-reverse";
}else{
avatar.src="https://cdn-icons-png.flaticon.com/512/4712/4712100.png";
}

row.appendChild(avatar);
row.appendChild(bubble);

historyBox.appendChild(row);

});

historyBox.scrollTop=historyBox.scrollHeight;

}catch(err){

historyBox.innerHTML='<div class="empty">Failed to load history.</div>';

}

}

async function clearHistory(){

if(!confirm("Delete all your chat history?")) return;

await fetch("/api/chat/history/clear",{method:"DELETE"});

loadHistory();

}

loadHistory();

</script>

</body>

</html>
