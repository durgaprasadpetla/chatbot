<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Login</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(120deg,#2563eb,#4f46e5);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Login Card */

.container{
    background:white;
    padding:40px;
    width:350px;
    border-radius:10px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.container h2{
    text-align:center;
    margin-bottom:25px;
}

/* Input fields */

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border-radius:5px;
    border:1px solid #ccc;
}

/* Button */

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    border:none;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

/* Register link */

.register-link{
    text-align:center;
    margin-top:15px;
}

.register-link a{
    text-decoration:none;
    color:#2563eb;
    font-weight:bold;
}

/* Error message */

.error{
    color:red;
    text-align:center;
    margin-bottom:15px;
}

</style>
</head>

<body>

<div class="container">

<h2>User Login</h2>

<!-- Spring Security Error -->
<p class="error" th:if="${param.error}">
Invalid email or password
</p>

<form action="/login" method="post">

<label>Email</label>
<input type="text" name="username" placeholder="Enter email" required>

<label>Password</label>
<input type="password" name="password" placeholder="Enter password" required>

<button type="submit">Login</button>

</form>

<div class="register-link">
New user? <a href="/register">Register</a>
</div>

</div>

</body>
</html>
