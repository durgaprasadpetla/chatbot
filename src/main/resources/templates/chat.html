<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Chatbot - Modern UI</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

/* ---------------------------------------------------- */
/* BACKGROUND IMAGE                                     */
/* ---------------------------------------------------- */
body {
  margin: 0;
  padding: 0;
  font-family: "Inter","Segoe UI",Arial;
  background: url("https://images.unsplash.com/photo-1508780709619-79562169bc64?auto=format&fit=crop&w=1350&q=80") no-repeat center center/cover;
  backdrop-filter: blur(5px);
  color: var(--text);
  transition: 0.3s ease-in-out;
}

.dark-mode {
  background: url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1350&q=80") no-repeat center center/cover;
}

.bg-overlay {
  position: fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(6px);
}

/* ---------------------------------------------------- */
/* COLOR VARIABLES                                      */
/* ---------------------------------------------------- */

:root {
  --glass: rgba(255,255,255,0.20);
  --glass-dark: rgba(0,0,0,0.25);

  --text:#fff;
  --user-bubble: rgba(255,255,255,0.85);
  --bot-bubble: rgba(0,255,180,0.85);

  --header-grad: linear-gradient(135deg,#43cea2,#185a9d);
  --send-grad: linear-gradient(135deg,#43cea2,#185a9d);
}

.dark-mode {
  --glass: rgba(0,0,0,0.45);
  --text:#eaeaea;
  --user-bubble: rgba(50,150,255,0.8);
  --bot-bubble: rgba(30,200,120,0.85);
}

/* ---------------------------------------------------- */
/* CHAT CONTAINER                                       */
/* ---------------------------------------------------- */

.chat-wrapper{
  position:relative;
  width:95%;
  max-width:800px;
  margin:60px auto;
  background:var(--glass);
  border-radius:20px;
  box-shadow:0 8px 25px rgba(0,0,0,0.35);
  backdrop-filter:blur(15px);
}

/* HEADER */

.chat-header{
  padding:18px 20px;
  background:var(--header-grad);
  border-radius:20px 20px 0 0;
  color:white;
  font-size:22px;
  font-weight:600;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.toggle-btn{
  background:rgba(255,255,255,0.28);
  border:none;
  padding:8px 14px;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.history-btn{
  background:rgba(255,255,255,0.28);
  padding:8px 14px;
  font-size:14px;
  color:white;
  border-radius:8px;
  text-decoration:none;
}

/* CHAT AREA */

#chatBox{
  height:540px;
  overflow-y:auto;
  padding:25px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

.msg{
  max-width:78%;
  padding:14px 18px;
  border-radius:16px;
  font-size:17px;
  line-height:1.6;
}

.user{
  margin-left:auto;
  background:var(--user-bubble);
  color:black;
  border-bottom-right-radius:4px;
}

.bot{
  background:var(--bot-bubble);
  color:black;
  border-bottom-left-radius:4px;
}

/* CODE BLOCK */

.msg pre{
  background:#111;
  color:#0f0;
  padding:10px;
  border-radius:8px;
}

/* TYPING */

.typing{
  padding-left:20px;
  color:white;
  font-style:italic;
}

/* INPUT AREA */

.input-area{
  display:flex;
  padding:20px;
  gap:12px;
  background:var(--glass-dark);
  border-radius:0 0 20px 20px;
}

#userInput{
  flex:1;
  padding:14px;
  border-radius:12px;
  border:none;
  font-size:17px;
}

.send-btn{
  padding:0 24px;
  background:var(--send-grad);
  border:none;
  border-radius:12px;
  font-size:18px;
  color:white;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="bg-overlay"></div>

<div class="chat-wrapper">

<div class="chat-header">
🤖 AI Intelligent Chat Assistant

<div style="display:flex; gap:10px;">

<a href="/history" class="history-btn">📜 History</a>

<button class="toggle-btn" onclick="clearChat()">🧹</button>

<a href="/logout" class="history-btn">🚪 Logout</a>

<button class="toggle-btn" onclick="toggleDarkMode()">🌙</button>

</div>
</div>

<div id="chatBox"></div>

<div id="typingIndicator" class="typing" style="display:none;">
Bot is typing...
</div>

<div class="input-area">

<input id="userInput" placeholder="Type your message...">

<button class="send-btn" onclick="sendMessage()">Send</button>

<button class="send-btn" onclick="startVoice()">🎤</button>

</div>

</div>

<script>

/* Dark Mode */

function toggleDarkMode(){
const active=document.body.classList.toggle("dark-mode");
localStorage.setItem("darkMode",active?"on":"off");
}

if(localStorage.getItem("darkMode")==="on"){
document.body.classList.add("dark-mode");
}

/* Append message */

function appendMessage(text,who){

let div=document.createElement("div");

div.className="msg "+who;

div.innerHTML=marked.parse(text);

document.getElementById("chatBox").appendChild(div);

document.getElementById("chatBox").scrollTop=
document.getElementById("chatBox").scrollHeight;

}

/* Typing indicator */

function showTyping(b){
document.getElementById("typingIndicator").style.display=b?"block":"none";
}

/* Send message */

async function sendMessage(){

let msg=document.getElementById("userInput").value.trim();

if(!msg) return;

appendMessage(msg,"user");

document.getElementById("userInput").value="";

showTyping(true);

try{

let response=await fetch("/api/chat/send",{

method:"POST",

headers:{ "Content-Type":"application/json" },

body:JSON.stringify({message:msg})

});

let data=await response.json();

showTyping(false);

appendMessage(data.reply,"bot");

speak(data.reply);

}

catch(err){

showTyping(false);

appendMessage("⚠️ AI server unreachable.","bot");

}

}

/* Enter key */

document.getElementById("userInput")
.addEventListener("keydown",e=>e.key==="Enter"&&sendMessage());

/* Clear chat */

function clearChat(){
document.getElementById("chatBox").innerHTML="";
}

/* Voice recognition */

function startVoice(){

const recognition=new(window.SpeechRecognition||window.webkitSpeechRecognition)();

recognition.lang="en-US";

recognition.start();

recognition.onresult=function(event){

let text=event.results[0][0].transcript;

document.getElementById("userInput").value=text;

sendMessage();

};

}

/* AI voice reply */

function speak(text){

const speech=new SpeechSynthesisUtterance(text);

speech.lang="en-US";

window.speechSynthesis.speak(speech);

}

</script>

</body>
</html>
